spring:
  application:
    name: khata-app
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  mvc:
    problemdetails:
      enabled: true
  web:
    resources:
      add-mappings: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

aws:
  region: ${AWS_REGION}
  dynamodb:
    table-name: ${AWS_DYNAMODB_TABLE_NAME}
    endpoint: ${AWS_DYNAMODB_ENDPOINT:}

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}

app:
  cors:
    # Keep local development usable while allowing production S3 website or
    # CloudFront origins to be supplied without changing the application.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.khataapp: INFO
spring:
  application:
    name: khata-app
  mvc:
    problemdetails:
      enabled: true
  web:
    resources:
      add-mappings: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

aws:
  region: ${AWS_REGION}
  dynamodb:
    table-name: ${AWS_DYNAMODB_TABLE_NAME}
    endpoint: ${AWS_DYNAMODB_ENDPOINT:}

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.khataapp: INFO